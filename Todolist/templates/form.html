<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{page_title}}</title>
</head>
<body>
    <h1>{{page_title}}</h1>
    <a href="/task?id={{id}}">[返回]</a>
    <hr>
    <form method="POST" action="{{action}}">

        <input type="hidden"  name="id" value="{{id}}">

        <div>
            <label>标题：</label><br>

            <input type="text" name="title" value="{{title}}">
        </div>

        <div>
            <label>描述：</label><br>
            <textarea name="description" rows="5" cols="60">{{description}}</textarea>
        </div>

        <div style="margin-bottom: 15px;">
            <label >选择截止日期：</label>
            <input type="date" name="deadline" min="{today_date}" value="{{deadline}}" required>
        </div>

        <input type="hidden" name="id" value="{{create_at}}">

        <button type="submit">[提交]</button>
    </form>
</body>
</html>
