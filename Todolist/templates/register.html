<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>注册账号</title>
</head>
<body>
    <h1>注册账号</h1>
    <hr>
    <form method="POST" action="/register">

        <div>
            <label>新用户名</label>
            <input type="text" name="title"  required>
        </div>

        <div>
            <label>密码</label>
            <input type="password" name="password"  required>
        </div>

        <button type="submit">提交</button>
    </form>
</body>
</html>
