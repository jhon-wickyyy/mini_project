<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>登录界面</title>
</head>
<body>
    <h1>登录</h1>
    <hr>
    <form method="POST" action="/login">

        <div>
            <label>用户名</label>
            <input type="text" name="title"  required>
        </div>

        <div>
            <label>密码</label>
            <input type="password" name="password"  required>
        </div>

        <button type="submit">提交</button>
    </form>
</body>
</html>
