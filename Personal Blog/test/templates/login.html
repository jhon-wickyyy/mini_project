<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>管理员登录</title>
</head>
<body style="max-width: 800px; margin: 20px auto;padding: 40px">

    <h1>登录管理员后台</h1>

    <div>{{error_msg}}</div>
    <form method="POST" action="/login">

        <div style="margin-box: 15px">
            账号：<input type="text" name="username" required>
        </div>

        <div style="margin-box: 15px">
            密码：<input type="password" name="password" required>
        </div>

        <button type="submit">登录</button>

    </form>
    <br>
    <a href="/">取消</a>

</body>
</html>
